# docker/tempo/tempo.yml
#
# Grafana Tempo - single-binary trace backend for the workspace-qdrant-mcp
# observability stack.
#
# Receives OTLP traces from the otel-collector (traces pipeline) and stores them
# locally so the memexd daemon's spans become queryable in Grafana via the Tempo
# datasource (Explore -> Tempo / TraceQL).
#
# Mount path inside container: /etc/tempo.yml
# Data volume:                 /var/tempo (workspace-qdrant-mcp_tempo_data)

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Flush blocks promptly so traces show up quickly in a low-volume dev stack.
  max_block_duration: 5m

compactor:
  compaction:
    # Local dev retention: keep one day of traces, then compact away. memexd
    # writes ~5 GB of blocks a day, so 48h kept ~11 GB for little benefit.
    #
    # Retention only runs while the blocklist poller succeeds. ONE block whose
    # meta.json is empty (a crash mid-write) makes every poll fail with
    # "unexpected end of JSON input", the compactor then sees no blocks, and
    # nothing is ever deleted: on 2026-11-10 the volume held 12k blocks back
    # to 2026-09-11 (11.2 GB). If `failed to poll` shows in the tempo logs,
    # move the block with the empty meta.json out of /var/tempo/blocks.
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
