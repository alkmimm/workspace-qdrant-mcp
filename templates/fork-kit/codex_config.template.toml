# Reference example for ~/.codex/config.toml (HTTP variant).
# Canonical values for `enabled_tools`, `startup_timeout_sec`, `tool_timeout_sec`
# live in src/typescript/mcp-server/src/constants/mcp-public-config.json.
# If you change them here, update the JSON too — drift is verified by the
# config-drift test in src/admin/__tests__/.

[projects.'\\wsl.localhost\Ubuntu-24.04\home\dev\repos\workspace-qdrant-mcp']
trust_level = "trusted"

[projects."/home/dev/repos/workspace-qdrant-mcp"]
trust_level = "trusted"

[mcp_servers.workspace-qdrant]
enabled = true
startup_timeout_sec = 20
tool_timeout_sec = 120
enabled_tools = ["search", "retrieve", "grep", "list", "store", "scratchpad", "rules", "workspace_index", "graph"]
url = "http://localhost:6335/mcp"
bearer_token_env_var = "MCP_HTTP_TOKEN"

# Bearer token: Codex resolves `bearer_token_env_var` ONLY from the process
# environment. For a streamable-HTTP server it does NOT accept a
# [mcp_servers.workspace-qdrant.env] table (Codex errors "env is not supported
# for streamable_http") and it strips any [.http_headers] block on
# re-serialization — so neither can carry the token here. Export MCP_HTTP_TOKEN
# in the environment Codex inherits before launching it, matching the value in
# docker/.env (what the running MCP server validates the Authorization header
# against). On Windows: `setx MCP_HTTP_TOKEN <token>` then restart Codex, or use
# scripts/windows/start-codex.ps1 which loads it from docker/.env.
