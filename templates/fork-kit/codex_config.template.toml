# Reference example for ~/.codex/config.toml (HTTP variant).
# Canonical values for `enabled_tools`, `startup_timeout_sec`, `tool_timeout_sec`
# live in src/typescript/mcp-server/src/constants/mcp-public-config.json.
# If you change them here, update the JSON too — drift is verified by the
# config-drift test in src/admin/__tests__/.

[projects.'\\wsl.localhost\Ubuntu-24.04\home\alkmimm\respositorios\workspace-qdrant-mcp']
trust_level = "trusted"

[projects."/home/alkmimm/respositorios/workspace-qdrant-mcp"]
trust_level = "trusted"

[mcp_servers.workspace-qdrant]
enabled = true
startup_timeout_sec = 20
tool_timeout_sec = 120
enabled_tools = ["search", "retrieve", "grep", "list", "store", "scratchpad", "rules", "workspace_index", "graph"]
url = "http://localhost:6335/mcp"
bearer_token_env_var = "MCP_HTTP_TOKEN"

[mcp_servers.workspace-qdrant.http_headers]
Authorization = "Bearer 0123456789abcdef0123456789abcdef"


[mcp_servers.workspace-qdrant.env]
QDRANT_URL = "http://localhost:6333"
WQM_DAEMON_ENDPOINT = "http://localhost:50051"
